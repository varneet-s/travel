<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <defs>
    <style>
      .chai-line { stroke: #c85a32; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .chai-sage { stroke: #497163; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .chai-faint { stroke: #0e2e25; stroke-width: 1; stroke-opacity: 0.3; fill: none; }
    </style>
  </defs>

  <!-- Distant Peak Silhouette behind mug -->
  <path d="M20,70 L55,42 L80,62 L110,35 L145,70" class="chai-faint" stroke-dasharray="3,3" />

  <!-- Enamel Chai Mug Body -->
  <path d="M52,50 L56,92 Q56,98 62,98 L98,98 Q104,98 104,92 L108,50 Z" class="chai-line" fill="rgba(200, 90, 50, 0.06)" />
  <!-- Mug Rim -->
  <ellipse cx="80" cy="50" rx="28" ry="4" class="chai-line" fill="#ffffff" />
  <ellipse cx="80" cy="50" rx="24" ry="3" fill="#c85a32" fill-opacity="0.15" />
  
  <!-- Mug Handle -->
  <path d="M106,58 C118,58 122,66 122,74 C122,82 116,88 103,88" class="chai-line" />

  <!-- Steam curls -->
  <path d="M72,42 Q68,32 74,22 T70,12" class="chai-line" stroke-width="1.2" stroke-dasharray="2,2" stroke-opacity="0.6" />
  <path d="M84,40 Q88,30 82,20 T86,10" class="chai-line" stroke-width="1.2" stroke-dasharray="2,2" stroke-opacity="0.7" />
  <path d="M94,44 Q90,36 96,28" class="chai-line" stroke-width="1" stroke-dasharray="2,2" stroke-opacity="0.5" />

  <!-- Cedar / Pine Needle Sprig resting next to mug -->
  <path d="M18,96 Q38,90 52,94" class="chai-sage" stroke-width="1.6" />
  <line x1="24" y1="94" x2="20" y2="86" class="chai-sage" />
  <line x1="28" y1="93" x2="26" y2="84" class="chai-sage" />
  <line x1="34" y1="92" x2="32" y2="82" class="chai-sage" />
  <line x1="40" y1="92" x2="39" y2="82" class="chai-sage" />
  <line x1="46" y1="93" x2="47" y2="84" class="chai-sage" />

  <line x1="24" y1="94" x2="22" y2="102" class="chai-sage" />
  <line x1="30" y1="93" x2="30" y2="103" class="chai-sage" />
  <line x1="36" y1="92" x2="38" y2="102" class="chai-sage" />
  <line x1="42" y1="92" x2="45" y2="101" class="chai-sage" />

  <!-- Ground Line / Wooden Table plank -->
  <line x1="10" y1="102" x2="150" y2="102" stroke="#0e2e25" stroke-opacity="0.12" stroke-width="1.2" stroke-linecap="round" />
</svg>