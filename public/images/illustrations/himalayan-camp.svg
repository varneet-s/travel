<!--
  License: MIT / CC0 (Public Domain)
  Nordic Alpine Ledger Linecraft: Himalayan Camp
  Palette Tokens: #D86B58 (Amber), #5B9B82 (Fjord Slate), #1E1B18 / #182024 (Navy), #CAD4CF (Mist)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" fill="none" role="img" aria-label="Himalayan mountain camp with canvas tent, campfire, and pine trees">
  <defs>
    <style>
      .camp-slate { stroke: #5B9B82; stroke-linecap: round; stroke-linejoin: round; }
      .camp-amber { stroke: #D86B58; stroke-linecap: round; stroke-linejoin: round; }
      .camp-navy { stroke: #1E1B18; stroke-linecap: round; stroke-linejoin: round; }
      .camp-mist { stroke: #CAD4CF; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Sky Accents: High Altitude Stars & Moon -->
  <path d="M174,18 L175.5,22.5 L180,24 L175.5,25.5 L174,30 L172.5,25.5 L168,24 L172.5,22.5 Z" fill="#D86B58" fill-opacity="0.85" />
  <circle cx="34" cy="22" r="1.5" fill="#CAD4CF" />
  <circle cx="92" cy="16" r="1" fill="#CAD4CF" />
  <circle cx="148" cy="28" r="1.2" fill="#CAD4CF" />
  <circle cx="120" cy="14" r="1" fill="#CAD4CF" />

  <!-- Far Distant Mountain Ridges -->
  <path d="M12,78 L48,38 L72,56 L108,24 L142,54 L164,36 L192,72" class="camp-mist" stroke-width="1.2" stroke-dasharray="3,3" />
  <path d="M108,24 L114,48 L122,64" class="camp-mist" stroke-width="1" stroke-dasharray="2,2" />
  <path d="M48,38 L54,54 L58,68" class="camp-mist" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Midground Glaciated Ridge -->
  <polygon points="40,82 82,44 118,78" fill="#5B9B82" fill-opacity="0.12" />
  <polygon points="118,78 146,50 178,86" fill="#5B9B82" fill-opacity="0.12" />
  <path d="M6,88 Q45,72 82,44 Q116,68 146,50 Q176,70 196,86" class="camp-slate" stroke-width="1.75" />
  <!-- Snow Arête Couloir line -->
  <path d="M82,44 L78,66 L72,84" class="camp-slate" stroke-width="1.2" />
  <path d="M146,50 L144,68 L140,86" class="camp-slate" stroke-width="1.2" />

  <!-- Terrain Ground Contour -->
  <path d="M4,124 Q48,121 95,123 T196,124" class="camp-navy" stroke-width="1.75" />
  <path d="M25,129 Q80,126 140,128 T185,129" class="camp-mist" stroke-width="1" stroke-opacity="0.6" />

  <!-- Alpine Pine Trees - Left Flank -->
  <!-- Tree 1 -->
  <path d="M22,123 L22,76" class="camp-navy" stroke-width="1.5" />
  <polygon points="22,74 14,88 18,88 12,100 17,100 10,114 34,114 27,100 32,100 26,88 30,88" fill="#5B9B82" fill-opacity="0.25" stroke="#1E1B18" stroke-width="1.4" stroke-linejoin="round" />
  <!-- Tree 2 (Smaller) -->
  <path d="M34,123 L34,88" class="camp-navy" stroke-width="1.2" />
  <polygon points="34,86 28,96 31,96 26,106 30,106 24,116 44,116 38,106 42,106 37,96 40,96" fill="#5B9B82" fill-opacity="0.3" stroke="#5B9B82" stroke-width="1.3" stroke-linejoin="round" />

  <!-- Alpine Pine Trees - Right Background -->
  <path d="M172,123 L172,82" class="camp-slate" stroke-width="1.4" />
  <polygon points="172,80 165,92 168,92 163,103 167,103 160,116 184,116 177,103 181,103 176,92 179,92" fill="#5B9B82" fill-opacity="0.2" stroke="#5B9B82" stroke-width="1.4" stroke-linejoin="round" />

  <!-- Classic Canvas A-Frame Ridge Tent -->
  <!-- Guy Lines & Pegs -->
  <line x1="68" y1="72" x2="42" y2="123" class="camp-amber" stroke-width="1.2" stroke-dasharray="4,2" />
  <line x1="106" y1="66" x2="128" y2="114" class="camp-amber" stroke-width="1.2" stroke-dasharray="4,2" />
  <circle cx="42" cy="123" r="1.5" fill="#D86B58" />
  <circle cx="128" cy="114" r="1.5" fill="#D86B58" />

  <!-- Tent Ridge Pole line -->
  <line x1="68" y1="72" x2="106" y2="66" class="camp-navy" stroke-width="2" />

  <!-- Tent Canvas Roof / Side Face -->
  <polygon points="68,72 106,66 118,110 84,120" fill="#5B9B82" fill-opacity="0.2" stroke="#1E1B18" stroke-width="1.6" />
  <!-- Canvas seams on side face -->
  <line x1="82" y1="70" x2="96" y2="116" class="camp-slate" stroke-width="1" stroke-opacity="0.6" />
  <line x1="94" y1="68" x2="107" y2="113" class="camp-slate" stroke-width="1" stroke-opacity="0.6" />

  <!-- Tent Front A-Frame Face -->
  <polygon points="68,72 52,120 84,120" fill="#FAF8F5" stroke="#1E1B18" stroke-width="1.6" />
  <!-- Open Doorway / Interior Shadow -->
  <polygon points="68,76 60,120 76,120" fill="#182024" />
  <!-- Tied Canvas Flaps (Amber Ties) -->
  <path d="M60,94 C57,98 56,108 55,120" class="camp-amber" stroke-width="1.5" />
  <path d="M76,94 C79,98 80,108 81,120" class="camp-amber" stroke-width="1.5" />
  <!-- Ridge Center Pole -->
  <line x1="68" y1="72" x2="68" y2="120" class="camp-navy" stroke-width="1.4" />

  <!-- Campfire Section -->
  <!-- Smoke Swirls -->
  <path d="M142,106 Q138,94 144,84 T140,68 T145,52" class="camp-mist" stroke-width="1.2" stroke-dasharray="3,2" stroke-opacity="0.75" />
  <path d="M145,104 Q149,92 144,80 T149,64" class="camp-mist" stroke-width="1" stroke-dasharray="2,2" stroke-opacity="0.5" />

  <!-- Flying Embers -->
  <circle cx="138" cy="98" r="1" fill="#D86B58" />
  <circle cx="146" cy="92" r="1.2" fill="#D86B58" />
  <circle cx="141" cy="85" r="0.8" fill="#D86B58" />

  <!-- Amber Hearth Glow -->
  <circle cx="142" cy="116" r="16" fill="#D86B58" fill-opacity="0.12" />

  <!-- Hearth Stone Ring -->
  <ellipse cx="132" cy="122" rx="4" ry="2.2" fill="#CAD4CF" stroke="#1E1B18" stroke-width="1.2" />
  <ellipse cx="140" cy="123" rx="4.5" ry="2.5" fill="#CAD4CF" stroke="#1E1B18" stroke-width="1.2" />
  <ellipse cx="149" cy="122" rx="4" ry="2.2" fill="#CAD4CF" stroke="#1E1B18" stroke-width="1.2" />
  <ellipse cx="135" cy="119" rx="3.5" ry="2" fill="#5B9B82" stroke="#1E1B18" stroke-width="1" />
  <ellipse cx="146" cy="119" rx="3.5" ry="2" fill="#5B9B82" stroke="#1E1B18" stroke-width="1" />

  <!-- Crossed Firewood Logs -->
  <line x1="131" y1="122" x2="152" y2="115" class="camp-navy" stroke-width="2.5" />
  <line x1="151" y1="122" x2="132" y2="115" class="camp-navy" stroke-width="2.5" />

  <!-- Campfire Dancing Flames -->
  <path d="M142,102 Q147,110 148,117 Q142,120 136,117 Q137,110 142,102 Z" fill="#D86B58" stroke="#D86B58" stroke-width="1.2" />
  <path d="M142,106 Q145,112 145,117 Q142,119 139,117 Q139,112 142,106 Z" fill="#FAF8F5" fill-opacity="0.9" />
</svg>
