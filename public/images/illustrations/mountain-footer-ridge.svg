<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 240" preserveAspectRatio="xMidYMid meet" fill="none" style="display:block;width:100%;height:auto;">
  <defs>
    <!-- Arrow Shaft Gradient (Sage into Gold) -->
    <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#40916c" />
      <stop offset="35%" stop-color="#a2d1bb" />
      <stop offset="70%" stop-color="#48cae4" />
      <stop offset="100%" stop-color="#e8a850" />
    </linearGradient>

    <!-- Sunset Sun Gradient -->
    <radialGradient id="sunsetGrad" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#ffdd00" />
      <stop offset="50%" stop-color="#ff9e00" />
      <stop offset="100%" stop-color="#e85d04" />
    </radialGradient>

    <!-- Ocean Wave Gradient -->
    <linearGradient id="oceanWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077b6" />
      <stop offset="50%" stop-color="#023e8a" />
      <stop offset="100%" stop-color="#03045e" />
    </linearGradient>
  </defs>

  <!-- Lower-half dark green background base (starts exactly at the arrow shaft y=120) -->
  <rect x="0" y="120" width="1440" height="120" fill="#071914" />

  <!-- Horizontally Flipped Arrow of the Elements -->
  <g id="arrow-elements-container" transform="translate(1440, 0) scale(-1, 1)">
  <!-- ======================================================================
       CENTRAL HORIZONTAL ARROW SHAFT (Pointing Right ->)
       ====================================================================== -->
  <line x1="70" y1="120" x2="1330" y2="120" stroke="url(#shaftGrad)" stroke-width="1.8" stroke-linecap="round" />

  <!-- ======================================================================
       1. LEFT: EVERGREEN PINE TREE (Lush Forest Green #2d6a4f, #40916c)
       ====================================================================== -->
  <g id="arrow-tail-pine">
    <!-- Tree Trunk -->
    <line x1="280" y1="120" x2="340" y2="120" stroke="#7f5539" stroke-width="2.5" stroke-linecap="round" />

    <!-- Branch Tier 1 (Apex Spire) -->
    <path d="M70,120 L95,120" stroke="#52b788" stroke-width="2" stroke-linecap="round" />
    <polygon points="90,120 102,113 100,120 102,127" fill="#40916c" />

    <!-- Branch Tier 2 -->
    <polygon points="100,120 120,107 116,120 120,133" fill="#2d6a4f" />
    <path d="M116,105 L128,97 M116,135 L128,143" stroke="#52b788" stroke-width="1.2" stroke-linecap="round" />

    <!-- Branch Tier 3 -->
    <polygon points="116,120 144,100 138,120 144,140" fill="#1b4332" />
    <path d="M138,98 L154,88 M138,142 L154,152" stroke="#40916c" stroke-width="1.3" stroke-linecap="round" />

    <!-- Branch Tier 4 -->
    <polygon points="138,120 172,90 164,120 172,150" fill="#2d6a4f" />
    <path d="M166,88 L186,76 M166,152 L186,164" stroke="#52b788" stroke-width="1.4" stroke-linecap="round" />
    <path d="M160,94 L178,82 M160,146 L178,158" stroke="#74c69d" stroke-width="1.1" stroke-linecap="round" />

    <!-- Branch Tier 5 (Lush Middle Boughs) -->
    <polygon points="164,120 204,80 194,120 204,160" fill="#1b4332" />
    <path d="M198,78 L222,62 M198,162 L222,178" stroke="#40916c" stroke-width="1.5" stroke-linecap="round" />
    <path d="M190,86 L212,72 M190,154 L212,168" stroke="#52b788" stroke-width="1.2" stroke-linecap="round" />

    <!-- Branch Tier 6 (Broad Lower Canopy) -->
    <polygon points="194,120 240,70 228,120 240,170" fill="#2d6a4f" />
    <path d="M234,68 L262,50 M234,172 L262,190" stroke="#52b788" stroke-width="1.6" stroke-linecap="round" />
    <path d="M224,78 L250,62 M224,162 L250,178" stroke="#74c69d" stroke-width="1.2" stroke-linecap="round" />

    <!-- Branch Tier 7 (Base Canopy) -->
    <polygon points="228,120 280,62 266,120 280,178" fill="#1b4332" />
    <path d="M272,60 L304,40 M272,180 L304,200" stroke="#40916c" stroke-width="1.8" stroke-linecap="round" />
    <path d="M260,72 L290,54 M260,168 L290,186" stroke="#52b788" stroke-width="1.3" stroke-linecap="round" />
  </g>

  <!-- ======================================================================
       2. TOP SIDE OF ARROW: REAL SNOW-COVERED MOUNTAINS & MOON
          Granite rock base (#344e41, #2f3e46) heavily blanketed with snow (#ffffff)
       ====================================================================== -->
  <g id="arrow-top-snow-mountains">
    <!-- Mountain Granite Base Ridge Polygon -->
    <polygon points="330,120 
                    350,112 360,115 380,95 395,104 420,72 440,88 465,58 480,75 510,48 
                    535,72 550,65 585,32 610,68 630,55 670,22 705,74 730,62 770,92 
                    800,84 840,120" 
             fill="#264653" stroke="#142834" stroke-width="1.6" />

    <!-- Pure Snow Covered Glaciers (Draped over summits down to mid-slope) -->
    <!-- Summit 1 Snow Blanket (465, 58) -->
    <polygon points="465,58 440,88 454,92 465,80 476,92 490,82" fill="#ffffff" stroke="#142834" stroke-width="1.2" stroke-linejoin="round" />
    <polygon points="465,58 465,80 476,92 490,82" fill="#e0f2fe" fill-opacity="0.8" />
    <line x1="465" y1="58" x2="465" y2="108" stroke="#142834" stroke-width="1.2" />

    <!-- Summit 2 Snow Blanket (585, 32) -->
    <polygon points="585,32 550,65 568,78 585,64 602,78 615,66" fill="#ffffff" stroke="#142834" stroke-width="1.2" stroke-linejoin="round" />
    <polygon points="585,32 585,64 602,78 615,66" fill="#e0f2fe" fill-opacity="0.85" />
    <line x1="585" y1="32" x2="585" y2="114" stroke="#142834" stroke-width="1.2" />

    <!-- Grand Sovereign Peak 3 Snow Blanket (670, 22) -->
    <polygon points="670,22 630,55 646,74 670,60 692,76 710,68" fill="#ffffff" stroke="#142834" stroke-width="1.3" stroke-linejoin="round" />
    <polygon points="670,22 670,60 692,76 710,68" fill="#e0f2fe" />
    <!-- Center Crevasse & Snow Spine -->
    <line x1="670" y1="22" x2="670" y2="118" stroke="#142834" stroke-width="1.4" />
    <path d="M656,66 L666,76 M646,84 L658,98 M684,68 L674,78 M694,84 L682,98" stroke="#142834" stroke-width="0.9" />

    <!-- Summit 4 Snow Blanket (770, 92) -->
    <polygon points="770,92 750,106 762,110 770,102 782,110 790,102" fill="#ffffff" stroke="#142834" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Alpine Night Crescent Moon (x: 525, y: 28) -->
    <path d="M525,18 C517,24 517,38 525,44 C520,39 520,25 525,18 Z" fill="#e8a850" stroke="#b07020" stroke-width="1" />
  </g>

  <!-- ======================================================================
       3. BOTTOM SIDE OF ARROW: SUNSET YELLOW-ORANGE SUN
          Warm golden yellow to deep orange (#ffdd00, #ff9e00, #e85d04)
       ====================================================================== -->
  <g id="arrow-bottom-sunset">
    <!-- Radiant Half Sun Disk below arrow shaft -->
    <path d="M555,120 A38,38 0 0,0 631,120 Z" fill="url(#sunsetGrad)" stroke="#ff9e00" stroke-width="1.8" />

    <!-- Glowing Sunset Rings -->
    <path d="M540,120 A53,53 0 0,0 646,120" stroke="#ffb703" stroke-width="1.2" stroke-dasharray="3,3" stroke-opacity="0.75" fill="none" />

    <!-- Sunset Beams (radiating down into the valley) -->
    <line x1="593" y1="160" x2="593" y2="190" stroke="#fb8500" stroke-width="2" stroke-linecap="round" />
    <line x1="573" y1="154" x2="557" y2="180" stroke="#ffb703" stroke-width="1.6" stroke-linecap="round" />
    <line x1="613" y1="154" x2="629" y2="180" stroke="#ffb703" stroke-width="1.6" stroke-linecap="round" />
    <line x1="557" y1="142" x2="532" y2="162" stroke="#fb8500" stroke-width="1.5" stroke-linecap="round" />
    <line x1="629" y1="142" x2="654" y2="162" stroke="#fb8500" stroke-width="1.5" stroke-linecap="round" />
    <line x1="546" y1="128" x2="520" y2="138" stroke="#ffb703" stroke-width="1.4" stroke-linecap="round" />
    <line x1="640" y1="128" x2="666" y2="138" stroke="#ffb703" stroke-width="1.4" stroke-linecap="round" />

    <!-- Warm Sunset Horizon Glow Curve -->
    <path d="M420,120 Q485,148 555,138 Q630,126 700,146 Q745,158 785,120" stroke="#fb8500" stroke-width="1.2" stroke-opacity="0.8" fill="none" />
  </g>

  <!-- ======================================================================
       4. BOTTOM / RIGHT SIDE OF ARROW: REAL OCEAN BLUE WAVES
          Deep ocean blues (#03045e, #0077b6, #48cae4) with white crests (#ffffff)
       ====================================================================== -->
  <g id="arrow-bottom-blue-waves">
    <!-- Wave 1 (Gentle Blue Swell) -->
    <path d="M780,120 C800,138 825,148 850,140 C868,134 865,124 855,120" stroke="#48cae4" stroke-width="1.4" fill="none" />
    <path d="M795,120 C815,132 835,138 850,132" stroke="#90e0ef" stroke-width="1" stroke-opacity="0.8" fill="none" />

    <!-- Wave 2 (Rising Mid Blue Wave) -->
    <path d="M840,120 C865,150 900,168 930,156 C955,146 950,130 935,122 L930,120" fill="#0077b6" fill-opacity="0.35" stroke="#0096c7" stroke-width="1.6" />
    <!-- White Seafoam Crest -->
    <path d="M912,160 C922,155 934,153 938,158 C930,162 920,164 912,160 Z" fill="#ffffff" />
    <path d="M860,120 C885,144 915,154 930,146" stroke="#90e0ef" stroke-width="1.2" fill="none" />

    <!-- Wave 3: Major Curling Hokusai-style Ocean Barrel Wave -->
    <path d="M920,120 C950,162 995,194 1045,182 C1085,172 1078,144 1052,132 C1030,122 1015,136 1028,146 C1042,156 1060,152 1065,164 C1068,174 1050,188 1025,194 C995,200 965,184 945,162 L935,150" 
          fill="url(#oceanWaveGrad)" stroke="#48cae4" stroke-width="1.8" />

    <!-- Wave Barrel Contour Shading -->
    <path d="M940,120 C970,154 1005,178 1040,172" stroke="#00b4d8" stroke-width="1.2" fill="none" />
    <path d="M960,120 C988,148 1018,166 1045,162" stroke="#90e0ef" stroke-width="1.1" fill="none" />
    <path d="M980,120 C1002,140 1025,152 1048,150" stroke="#caf0f8" stroke-width="0.9" fill="none" />

    <!-- Pure White Foaming Wave Crests -->
    <path d="M1030,182 C1042,175 1056,173 1060,180 C1050,186 1038,188 1030,182 Z" fill="#ffffff" />
    <path d="M1045,132 C1052,127 1060,129 1062,136 C1056,140 1048,138 1045,132 Z" fill="#ffffff" />

    <!-- Wave 4 (Terminal Coastal Surf) -->
    <path d="M1050,120 C1075,148 1110,156 1140,144 C1160,136 1155,124 1145,120" stroke="#0077b6" stroke-width="1.5" fill="none" />
    <path d="M1070,120 C1095,140 1120,146 1135,138" stroke="#90e0ef" stroke-width="1.1" fill="none" />

    <!-- Vibrant White & Aquamarine Sea Spray Droplets -->
    <circle cx="862" cy="144" r="1.8" fill="#ffffff" />
    <circle cx="870" cy="138" r="1.4" fill="#90e0ef" />
    <circle cx="945" cy="166" r="2.0" fill="#ffffff" />
    <circle cx="955" cy="158" r="1.5" fill="#48cae4" />
    <circle cx="1062" cy="150" r="2.2" fill="#ffffff" />
    <circle cx="1074" cy="156" r="1.6" fill="#90e0ef" />
    <circle cx="1068" cy="190" r="2.4" fill="#ffffff" />
    <circle cx="1080" cy="196" r="1.8" fill="#48cae4" />
    <circle cx="1148" cy="148" r="1.8" fill="#ffffff" />
    <circle cx="1158" cy="152" r="1.4" fill="#90e0ef" />
  </g>

  <!-- ======================================================================
       5. RIGHT: ARROWHEAD POINTING RIGHT (->) & THREE COORDINATE DOTS
       ====================================================================== -->
  <g id="arrow-head-pointing-right">
    <!-- Arrow Fletching Knot Rings before tip -->
    <circle cx="1195" cy="120" r="4.5" stroke="#e8a850" stroke-width="1.5" fill="none" />
    <circle cx="1212" cy="120" r="4.5" stroke="#e8a850" stroke-width="1.5" fill="none" />

    <!-- Bold Golden Arrow Head Pointing RIGHT (->) -->
    <!-- Top Barb -->
    <polygon points="1265,100 1318,120 1265,120" fill="#e8a850" stroke="#f3c272" stroke-width="1.5" />
    <!-- Bottom Barb (Terracotta shading) -->
    <polygon points="1265,140 1318,120 1265,120" fill="#c85a32" stroke="#f3c272" stroke-width="1.5" />
    <!-- Sharp Piercing Tip Spine -->
    <line x1="1255" y1="120" x2="1332" y2="120" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Three Geodetic Coordinate Dots at the Arrow Tip -->
    <circle cx="1352" cy="120" r="2.8" fill="#ffffff" />
    <circle cx="1368" cy="120" r="2.8" fill="#fb8500" />
    <circle cx="1384" cy="120" r="2.8" fill="#ffb703" />
  </g>
  </g>
</svg>